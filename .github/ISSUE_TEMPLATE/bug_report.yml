name: Bug report
description: Something in CueBack doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Watch Chrome
        2. Lock the phone for 3 minutes
        3. Come back
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Moto g34, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CueBack version
      description: Shown at the bottom of Settings.
